<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pokladna Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Klubový pult: tmavé dřevo, pivní jantar jako jediný akcent, velké dlaždice na ťukání palcem */
:root{
  --bg:#16130f; --panel:#221e18; --panel2:#2b261f; --line:#3d362c;
  --fg:#f4ede1; --muted:#a89c89; --amber:#eaa733; --amber-ink:#1d1406;
  --good:#71c48f; --bad:#f07261; --warn:#e9c45a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.4 var(--body);min-height:100vh;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.narrow{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.5rem}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top h1{font-size:1.6rem}
.clock{font-family:var(--display);font-size:1.6rem;color:var(--muted)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus{border-color:var(--amber);outline:none}

/* balance */
.bal{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.bal-label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}

/* item tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:110px;padding:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-align:left;transition:transform .08s,background .15s}
.tile:active{transform:scale(.97);background:var(--panel2)}
.tile .n{font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.05}
.tile .p{font-variant-numeric:tabular-nums;color:var(--amber);font-weight:600}
.tile .ft{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile .s{font-size:.75rem;color:var(--muted);white-space:nowrap}
.tile .s.low{color:var(--warn)}
.tile.has .n{padding-right:34px}
.tile.big{width:100%;min-height:130px;margin-bottom:10px;padding:18px 20px;border-color:#6b5426;background:linear-gradient(135deg,#3a2c12,var(--panel) 70%)}
.tile.big .n{font-size:2.3rem;line-height:1}
.tile.big .p{font-size:1.15rem}
.tile.big .cnt{min-width:40px;height:40px;border-radius:20px;font-size:1.15rem;right:14px;top:14px}
.tile.big .eyebrow{color:var(--amber)}
.favpick{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.favpick select{width:auto;padding:6px 10px;font-size:.85rem}
.tile .cnt{position:absolute;right:8px;top:8px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--amber);color:var(--amber-ink);
  font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tile.pulse{animation:pulse .35s ease}
@keyframes pulse{50%{background:#3a2f17;border-color:var(--amber)}}

/* sections */
.sec{margin-top:22px}
.sec>h2,.sec>.sechead{margin-bottom:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{min-width:0}
.li .sub{font-size:.82rem;color:var(--muted)}
.li.storno .main,.li.storno .amt{text-decoration:line-through;opacity:.5}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.pendlab{font-size:.78rem;font-weight:700;color:var(--warn);border:1px dashed var(--warn);border-radius:999px;padding:2px 8px;white-space:nowrap}
.netbar{margin-top:12px;padding:10px 14px;border-radius:10px;background:#2c2614;border:1px solid #6a5a22;color:var(--warn);display:flex;gap:8px;flex-wrap:wrap}
.netbar.down{background:#33191a;border-color:var(--bad);color:#f6c2bb}
.stlab{font-size:.78rem;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:999px;padding:2px 8px;white-space:nowrap}

/* member hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:20px 0 16px;flex-wrap:wrap}
.hero h1{font-size:2.4rem;line-height:1}
.hero .bal{font-size:2.6rem;line-height:1}
.hero .balbox{text-align:right}
.pinme{margin-top:8px;font-size:.85rem;color:var(--muted)}
.pinme b{color:var(--fg);font-size:1rem;letter-spacing:.2em;margin-left:4px}

/* tablet member grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mcard{display:flex;flex-direction:column;gap:8px;padding:14px;min-height:120px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-align:left}
.mcard .nm{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1}
.mcard .bal{font-size:1.4rem}
.mcard .today{font-size:.82rem;color:var(--muted);margin-top:auto}
.mcard.active{border-color:#6b5426;background:linear-gradient(180deg,#2c2416,var(--panel))}
.mcard.host{border-style:dashed}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pres{margin:0 0 16px;padding:14px 16px}
.reqbanner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 16px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--amber);background:#3a2c12;color:var(--fg);animation:rqblink 1.1s ease-in-out infinite}
.reqbanner b{font-family:var(--display);font-size:1.25rem}
.rqwho{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.rqcta{margin-left:auto;font-weight:700;color:var(--amber);white-space:nowrap}
.rqdot{width:14px;height:14px;border-radius:50%;background:var(--amber);flex:none;box-shadow:0 0 0 0 rgba(234,167,51,.7);animation:live 1.4s infinite}
@keyframes rqblink{50%{background:#5a4214;border-color:#ffd27a}}
.tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.75rem;margin-left:4px;animation:rqblink2 1.1s infinite}
@keyframes rqblink2{50%{opacity:.35}}
.reqcard{padding:12px;margin-bottom:12px;border:1px dashed var(--warn);border-radius:10px}
.reqadm{margin-bottom:10px;border-color:var(--amber)}
.okbtn{background:var(--good);border-color:var(--good);color:#0d2416}
.sndbtn{display:inline-flex;align-items:center;justify-content:center;padding:6px 8px;line-height:0}
.eyebrow .sndbtn{padding:2px 6px;border:0;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pres.open{border-color:#2f5a3c;background:linear-gradient(180deg,#1d2a1f,var(--panel))}
.pres-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pres-st{display:flex;align-items:center;gap:12px}
.pres-t{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1}
.live{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.live.on{background:var(--good);box-shadow:0 0 0 0 rgba(113,196,143,.6);animation:live 2s infinite}
.live.sm{width:9px;height:9px;margin-left:8px;vertical-align:middle}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(113,196,143,0)}100%{box-shadow:0 0 0 0 rgba(113,196,143,0)}}
.pres-who{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.who{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:.92rem}
.who.me{border-color:var(--good)}
.herechip{font-size:.78rem;font-weight:600;color:var(--good)}
.sheet .bar h2{margin-right:auto}
.sheet .bar{justify-content:flex-start;flex-wrap:wrap}
tr.garow td{background:rgba(113,196,143,.06)}
.lowbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lowbar .chip{border-color:#6a5a22;color:var(--warn)}

/* overlay sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sheet .bar h2{font-size:2rem}

/* PIN pad */
.pin{max-width:320px;margin:20px auto;text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0 22px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dot.on{background:var(--amber);border-color:var(--amber)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:68px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-size:1.8rem;font-weight:600}
.pad button:active{background:var(--panel2)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* QR */
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;border-radius:10px;padding:8px;width:180px;height:180px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.qrinfo{min-width:0;flex:1 1 200px;display:flex;flex-direction:column;gap:6px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;word-break:break-all}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--amber)}
.adm-item{border-bottom:1px solid var(--line);padding:12px 0}
.adm-item:last-child{border-bottom:0}
.adm-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.adm-panel{margin-top:12px;padding:12px;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:.82rem;color:var(--muted);margin:0 0 8px}
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);font:600 .7rem/1 var(--body);letter-spacing:0;text-transform:none;cursor:help;vertical-align:1px;margin-left:4px;position:relative}
.info:hover::after,.info:focus::after{content:attr(title);position:absolute;left:0;top:22px;z-index:30;width:240px;padding:10px 12px;border-radius:10px;background:var(--fg);color:var(--bg);font:500 .82rem/1.35 var(--body);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.stats .bal{font-size:1.6rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
tr.storno td{opacity:.45;text-decoration:line-through}
tr.storno td:nth-last-child(-n+2){text-decoration:none;opacity:1}
tr.pend td{background:#3a1f1a}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.addgrid .btn{text-align:left;padding:12px}
.sellrows{display:flex;flex-direction:column;gap:8px}
.sellrow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.sellrow:has(> :nth-child(2):last-child){grid-template-columns:2fr 1fr}
@media (max-width:520px){.sellrow{grid-template-columns:1fr 1fr}.sellrow > :first-child{grid-column:1/-1}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.confirm{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;border-color:var(--bad)}

/* toast + demo */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast button{background:var(--bg);color:var(--fg);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.toast.err{background:var(--bad);color:#1f0a07}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-top:12px;border:1px dashed #6a5a22;border-radius:10px;font-size:.9rem}
.demo b{color:var(--warn)}
.empty{padding:18px 0;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:520px){
  .hero h1{font-size:2rem} .hero .bal{font-size:2.1rem}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile{min-height:96px} .tile .n{font-size:1.25rem}
  .mgrid{grid-template-columns:repeat(2,1fr)}
}
/* tisk na účtenkovou tiskárnu 80 mm (tiskne se jen #printarea) */
#printarea{display:none}
@media print{
  @page{margin:0}
  html,body{background:#fff!important;color:#000!important;padding:0!important;margin:0!important}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block!important;width:72mm;margin:0 auto;padding:2mm 0 6mm;font:13px/1.35 "Courier New",Courier,monospace;color:#000}
}
.bon{color:#000;font:13px/1.35 "Courier New",Courier,monospace}
.bon .bh{text-align:center;font-weight:700;font-size:16px;border-top:2px dashed #000;border-bottom:2px dashed #000;padding:3px 0;margin-bottom:4px}
.bon .big{font-size:20px;font-weight:700;margin:6px 0}
.bon .row2{display:flex;justify-content:space-between;gap:6px}
.bon .sep{border-top:1px dashed #000;margin:5px 0}
.bon .ctr{text-align:center}
.bon.storno .bh{background:#000;color:#fff}
.bon .bonqr{width:46mm;max-width:80%;margin:6px auto}
.bon .bonqr svg{width:100%;height:auto;display:block}
.qrfull{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.85);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qrfull-in{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:440px;width:100%}
.qrfull-in h2{font-size:2.2rem}
.qrbigbox{background:#fff;border-radius:12px;padding:12px;width:min(340px,70vw)}
.qrbigbox svg{width:100%;height:auto;display:block}
#paper{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;width:250px;max-height:42vh;overflow:auto;background:#f6f3ec;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:10px 12px}
#paper .ph{display:flex;justify-content:space-between;align-items:center;font:600 .78rem/1 var(--body);color:#555;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
#paper .ph button{border:0;background:#ddd;border-radius:6px;padding:4px 8px;font-weight:700;color:#222}
#paper .bon{padding:8px 0;border-bottom:1px dotted #999}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="demo" hidden></div>
<div id="net" hidden></div>
<main id="app"><div class="loading">Načítám…</div></main>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="printarea" aria-hidden="true"></div>
<div id="paper" hidden></div>

<script src="config.js"></script>

      .map(function (s) { return { id: s.id, nazev: s.nazev, jednotka: s.jednotka === 'l' ? 'l' : 'ks', stav: r3(+s.stav || 0), baleni: +s.baleni || 0,
        obal: s.obal || '', nizko: +s.nizko || 0, aktivni: act(s), poradi: +s.poradi || 0 }; });
  }

  function state(db, a, p) {
    var w = who(db, a), now = Date.now(), today = startOfDay(now);
    // začátek dne posílá prohlížeč (zná místní čas); server ho jen zkontroluje
    var ds = Math.round(+(p && p.dayStart) || 0);
    if (ds && ds <= now && now - ds < 26 * 3600 * 1000) today = ds;
    if (w.role === 'member') {
      var me = w.member;
      var mine = db.moves.filter(function (m) { return m.clenId === me.id; }).sort(function (x, y) { return y.ts - x.ts; });
      return { role: 'member', settings: settingsOut(db), items: itemsOut(db), stocks: stocksOut(db), presence: presenceOut(db, now),
        me: { id: me.id, jmeno: me.jmeno, vs: me.vs, balance: balance(db, me.id), oblibena: me.oblibena || '', hlavni: mainItem(db, me) },
        moves: mine.slice(0, 60).map(function (m) { return moveOut(db, m); }), now: now, undoMs: UNDO_MS,
        reqs: reqs(db).filter(function (r) { return r.clenId === me.id; }).sort(function (x, y) { return y.ts - x.ts; }).slice(0, 8).map(function (r) { return reqOut(db, r); }) };
    }
    var admin = w.role === 'admin';
    var members = db.members.filter(function (m) { return admin || act(m); }).map(function (m) {
      var todays = db.moves.filter(function (x) { return x.clenId === m.id && x.typ === 'konzumace' && !x.storno && x.ts >= today; });
      var o = { id: m.id, jmeno: m.jmeno, typ: m.typ, vs: m.vs, aktivni: act(m), hasPin: !!m.pin, balance: balance(db, m.id),
        oblibena: m.oblibena || '', hlavni: mainItem(db, m),
        dnesKs: todays.reduce(function (s, x) { return s + (+x.ks || 0); }, 0),
        dnesKc: r2(todays.reduce(function (s, x) { return s + (+x.castka || 0); }, 0)),
        lastTs: todays.length ? Math.max.apply(null, todays.map(function (x) { return +x.ts; })) : 0 };
      if (admin) { o.token = m.token; o.pin = m.pin; }
      return o;
    });
    var moves = db.moves.slice().sort(function (x, y) { return y.ts - x.ts; }).slice(0, admin ? 3000 : 80);
    return { role: w.role, settings: settingsOut(db, admin), items: itemsOut(db, admin), stocks: stocksOut(db, admin), members: members,
      presence: presenceOut(db, now), visits: admin ? visitsOut(db, now) : undefined,
      reqs: reqs(db).filter(function (r) { return admin ? true : r.stav === 'ceka'; }).sort(function (x, y) { return y.ts - x.ts; }).slice(0, admin ? 300 : 30).map(function (r) { return reqOut(db, r); }),
      moves: moves.map(function (m) { return moveOut(db, m); }), now: now, undoMs: UNDO_MS };
  }

  function add(db, a, p) {
    var w = who(db, a), m;
    if (w.role === 'member') m = w.member;
    else {
      m = memberById(db, p.clenId);
      if (!m || !act(m)) err('Člen nenalezen.');
      if (w.role === 'tablet') checkMemberPin(m, p.pin);
    }
    var it = itemById(db, p.polozkaId);
    if (!it || !act(it)) err('Položka není v nabídce.');
    var ks = Math.round(+p.ks || 1);
    if (ks < 1 || ks > 20) err('Počet musí být 1–20.');
    // offline fronta: klient posílá vlastní id (qid) a čas zápisu; opakované odeslání se nezapíše dvakrát
    var qid = (typeof p.qid === 'string' && /^q[a-z0-9]{6,40}$/.test(p.qid)) ? p.qid : null;
    if (qid) {
      var dup = db.moves.filter(function (x) { return x.id === qid; })[0];
      if (dup) return { ok: true, dup: true, move: moveOut(db, dup), balance: balance(db, dup.clenId) };
    }
    var ts = Date.now(), cts = Math.round(+p.ts || 0);
    if (cts && cts < ts && ts - cts < 72 * 3600 * 1000) ts = cts;
    var st = stockById(db, it.zasobaId), q = st ? r3(ks * (+it.spotreba || 0)) : 0;
    var mv = { id: qid || newId('k'), ts: ts, typ: 'konzumace', clenId: m.id, polozkaId: it.id, ks: ks,
      castka: r2(ks * +it.cena), zdroj: w.role, storno: 0, pozn: '', zasobaId: st ? st.id : '', mnozstvi: q };
    db.moves.push(mv); op(db, 'append', 'moves', mv);
    if (st) { st.stav = r3((+st.stav || 0) - q); op(db, 'update', 'stocks', st); }
    touchMember(db, m, ts, w.role); // pití = jsem v Garage (a Garage je otevřená)
    return { ok: true, move: moveOut(db, mv), balance: balance(db, m.id) };
  }

  function undo(db, a, p) {
    var w = who(db, a);
    var mv = db.moves.filter(function (x) { return x.id === p.moveId; })[0];
    if (!mv || mv.storno) err('Záznam už je zrušený nebo neexistuje.');
    if (w.role !== 'admin') {
      if (mv.typ !== 'konzumace') err('Tohle může zrušit jen správce.');
      if (Date.now() - mv.ts > UNDO_MS) err('Na zrušení je čas jen 2 minuty. Řekni to pokladníkovi.');
      if (w.role === 'member' && mv.clenId !== w.member.id) err('Cizí záznam.');
      if (w.role === 'tablet') checkMemberPin(memberById(db, mv.clenId) || {}, p.pin);
    }
    mv.storno = w.role; op(db, 'update', 'moves', mv);
    var st = stockById(db, mv.zasobaId), q = +mv.mnozstvi || 0;
    if (st && mv.typ === 'konzumace') { st.stav = r3((+st.stav || 0) + q); op(db, 'update', 'stocks', st); }
    if (st && mv.typ === 'naskladneni') { st.stav = r3((+st.stav || 0) - q); op(db, 'update', 'stocks', st); }
    return { ok: true };
  }

  function addPayment(db, m, c, zp, zdroj) {
    var mv = { id: newId('p'), ts: Date.now(), typ: 'platba', clenId: m.id, polozkaId: '', ks: 0, castka: c,
      zdroj: zdroj, storno: 0, pozn: zp, zustatek: r2(balance(db, m.id) + c) };
    db.moves.push(mv); op(db, 'append', 'moves', mv);
    return mv;
  }
  function pay(db, a, p) {
    var w = who(db, a), m = memberById(db, p.clenId);
    if (!m) err('Člen nenalezen.');
    if (w.role === 'member') err('Platbu potvrzuje pokladník.');
    if (w.role === 'tablet') err('Platbu zapisuje jen správce.');
    var c = r2(+p.castka);
    if (!(c > 0) || c > 100000) err('Zadej částku.');
    addPayment(db, m, c, p.zpusob === 'qr' ? 'qr' : 'hotove', w.role);
    return { ok: true, balance: balance(db, m.id) };
  }

  /* ---------- hlášení plateb: člen nahlásí, správce zkontroluje v bance / převezme hotovost a přijme ---------- */
  function reqs(db) { return db.reqs = db.reqs || []; }
  function reqOut(db, r) {
    var m = memberById(db, r.clenId);
    return { id: r.id, ts: +r.ts, clenId: r.clenId, jmeno: m ? m.jmeno : '?', vs: m ? m.vs : '', castka: +r.castka, zpusob: r.zpusob,
      stav: r.stav, vyrizeno: +r.vyrizeno || 0, kdo: r.kdo || '', duvod: r.duvod || '', cislo: r.cislo || '' };
  }
  function requestPay(db, a, p) {
    var w = who(db, a), m = w.role === 'member' ? w.member : memberById(db, p.clenId);
    if (w.role === 'admin') err('Správce platbu rovnou zapíše v Členové → Přijmout platbu.');
    if (!m || !act(m)) err('Člen nenalezen.');
    var c = r2(num(p.castka)); if (!(c >= 1) || c > 100000) err('Zadej částku.');
    var zp = p.zpusob === 'qr' ? 'qr' : 'hotove';
    var open = reqs(db).filter(function (r) { return r.clenId === m.id && r.stav === 'ceka'; });
    if (open.length >= 5) err('Máš 5 nevyřízených hlášení. Počkej, až je správce potvrdí, nebo některé zruš.');
    var cislo = reqs(db).reduce(function (s, r) { return Math.max(s, +r.cislo || 0); }, 0) + 1;
    var r = { id: newId('r'), ts: Date.now(), clenId: m.id, castka: c, zpusob: zp, stav: 'ceka', vyrizeno: 0, kdo: w.role, duvod: '', cislo: cislo, moveId: '' };
    reqs(db).push(r); op(db, 'append', 'reqs', r);
    return { ok: true, req: reqOut(db, r) };
  }
  function cancelPayReq(db, a, p) {
    var w = who(db, a), r = reqs(db).filter(function (x) { return x.id === p.id; })[0];
    if (!r || r.stav !== 'ceka') err('Hlášení už je vyřízené.');
    if (w.role === 'member' && r.clenId !== w.member.id) err('Cizí hlášení.');
    r.stav = 'zruseno'; r.vyrizeno = Date.now(); op(db, 'update', 'reqs', r);
    return { ok: true };
  }
  function resolvePayReq(db, a, p) {
    needAdmin(db, a);
    var r = reqs(db).filter(function (x) { return x.id === p.id; })[0];
    if (!r || r.stav !== 'ceka') err('Hlášení už je vyřízené.');
    var m = memberById(db, r.clenId); if (!m) err('Člen nenalezen.');
    r.vyrizeno = Date.now();
    if (p.prijmout) {
      var c = p.castka != null && p.castka !== '' ? r2(num(p.castka)) : +r.castka;   // správce může opravit částku podle banky
      if (!(c > 0)) err('Zadej částku.');
      r.moveId = addPayment(db, m, c, r.zpusob, 'admin').id; r.stav = 'prijato'; if (c !== +r.castka) r.duvod = 'přijato ' + c + ' Kč';
    } else { r.stav = 'zamitnuto'; r.duvod = String(p.duvod || '').slice(0, 120); }
    op(db, 'update', 'reqs', r);
    return { ok: true, balance: balance(db, m.id) };
  }

  function needAdmin(db, a) { if (who(db, a).role !== 'admin') err('Jen pro správce.'); }

  function stock(db, a, p) {
    needAdmin(db, a);
    var st = stockById(db, p.zasobaId); if (!st) err('Zásoba nenalezena.');
    var q, bal = 0;
    if (p.inventura) {
      var v = num(p.stav); if (!(v >= 0)) err('Zadej skutečný stav.');
      q = r3(v - (+st.stav || 0)); if (!q) return { ok: true };
    } else if (p.baleni != null && p.baleni !== '') {
      bal = num(p.baleni); if (!bal) err('Zadej počet.');
      var size = num(p.velikost); if (!(size > 0)) size = +st.baleni || 1;
      q = r3(bal * size);
    } else { q = r3(num(p.mnozstvi)); if (!q) err('Zadej množství.'); }
    var mv = { id: newId('n'), ts: Date.now(), typ: 'naskladneni', clenId: '', polozkaId: '', ks: bal, castka: 0,
      zdroj: 'admin', storno: 0, pozn: p.inventura ? 'inventura' : (bal && st.jednotka === 'l' ? bal + '× ' + String(r3(q / bal)).replace('.', ',') + ' l' : ''), zasobaId: st.id, mnozstvi: q };
    db.moves.push(mv); op(db, 'append', 'moves', mv);
    st.stav = r3((+st.stav || 0) + q); op(db, 'update', 'stocks', st);
    return { ok: true };
  }

  function newStock(db, o) {
    var max = (db.stocks || []).reduce(function (s, x) { return Math.max(s, +x.poradi || 0); }, 0);
    var st = { id: newId('z'), nazev: o.nazev, jednotka: o.jednotka, stav: 0, baleni: o.baleni, obal: o.obal, nizko: o.nizko, aktivni: 1, poradi: max + 10 };
    (db.stocks = db.stocks || []).push(st); op(db, 'append', 'stocks', st);
    return st;
  }
  function newItem(db, o) {
    var max = db.items.reduce(function (s, x) { return Math.max(s, +x.poradi || 0); }, 0);
    var it = { id: newId('i'), nazev: o.nazev, cena: o.cena, zasobaId: o.zasobaId || '', spotreba: o.spotreba || 0, aktivni: 1, poradi: max + 10 };
    db.items.push(it); op(db, 'append', 'items', it);
    return it;
  }
  function checkSell(list, jed) { // položky k prodeji zadané rovnou se zásobou – nejdřív vše zkontrolovat, pak teprve zapisovat
    return (Array.isArray(list) ? list : []).filter(function (x) { return x && String(x.nazev || '').trim(); }).map(function (x) {
      var c = num(x.cena); if (!(c >= 0)) err('Zadej cenu u položky „' + String(x.nazev).trim() + '“.');
      var sp = jed === 'ks' ? (num(x.spotreba) > 0 ? num(x.spotreba) : 1) : num(x.spotreba);
      if (!(sp > 0)) err('Zadej objem u položky „' + String(x.nazev).trim() + '“ (např. 0,5).');
      return { nazev: String(x.nazev).trim(), cena: r2(c), spotreba: r3(sp) };
    });
  }

  function saveStock(db, a, p) {
    needAdmin(db, a);
    var nazev = String(p.nazev || '').trim(); if (!nazev) err('Zadej název zásoby.');
    var jed = p.jednotka === 'l' ? 'l' : 'ks';
    var baleni = num(p.baleni); if (!(baleni > 0)) baleni = jed === 'l' ? 15 : 1;
    var obal = String(p.obal || '').trim() || (jed === 'l' ? 'sud' : 'balení');
    var nizko = num(p.nizko); if (!(nizko >= 0)) nizko = 0;
    var st = p.id ? stockById(db, p.id) : null;
    if (st) {
      st.nazev = nazev; st.jednotka = jed; st.baleni = baleni; st.obal = obal; st.nizko = nizko; st.aktivni = p.aktivni === false ? 0 : 1;
      op(db, 'update', 'stocks', st);
    } else {
      var sell = checkSell(p.polozky, jed);
      if (p.nizko == null || p.nizko === '') nizko = jed === 'l' ? 5 : 5;
      st = newStock(db, { nazev: nazev, jednotka: jed, baleni: baleni, obal: obal, nizko: nizko });
      var made = sell.map(function (x) { return newItem(db, { nazev: x.nazev, cena: x.cena, zasobaId: st.id, spotreba: x.spotreba }).nazev; });
      return { ok: true, id: st.id, polozky: made };
    }
    return { ok: true, id: st.id };
  }

  function deleteStock(db, a, p) {
    needAdmin(db, a);
    var st = stockById(db, p.id); if (!st || +st.smazano) err('Zásoba nenalezena.');
    // měkké smazání: z nabídky zmizí, historie pohybů si název ponechá
    st.smazano = 1; st.aktivni = 0; op(db, 'update', 'stocks', st);
    var odpojeno = [], smazano = [];
    db.items.forEach(function (it) {
      if (it.zasobaId !== st.id || +it.smazano) return;
      if (p.sPolozkami) { it.smazano = 1; it.aktivni = 0; smazano.push(it.nazev); }   // smazat i položky, které z ní prodávají
      else { it.zasobaId = ''; it.spotreba = 0; odpojeno.push(it.nazev); }
      op(db, 'update', 'items', it);
    });
    return { ok: true, odpojeno: odpojeno, smazano: smazano };
  }

  function deleteItem(db, a, p) {
    needAdmin(db, a);
    var it = itemById(db, p.id); if (!it || +it.smazano) err('Položka nenalezena.');
    // měkké smazání: zmizí z nabídky i ze Správce, historie pohybů si název ponechá
    it.smazano = 1; it.aktivni = 0; op(db, 'update', 'items', it);
    var st = stockById(db, it.zasobaId), dalsi = st && db.items.some(function (x) { return x.zasobaId === st.id && !+x.smazano; });
    return { ok: true, zasoba: st && !dalsi ? { id: st.id, nazev: st.nazev } : null };
  }

  function saveItem(db, a, p) {
    needAdmin(db, a);
    var nazev = String(p.nazev || '').trim(); if (!nazev) err('Zadej název.');
    var cena = r2(+p.cena); if (!(cena >= 0)) err('Zadej cenu.');
    var zid = String(p.zasobaId || ''), sp = 0, mkStock = zid === 'novy';
    if (mkStock) {
      if ((db.stocks || []).some(function (z) { return !+z.smazano && z.nazev.toLowerCase() === nazev.toLowerCase(); })) err('Zásoba „' + nazev + '“ už existuje – vyber ji v seznamu.');
      zid = newStock(db, { nazev: nazev, jednotka: 'ks', baleni: 1, obal: 'ks', nizko: 5 }).id; sp = 1;
    } else if (zid) {
      var st = stockById(db, zid); if (!st || +st.smazano) err('Vybraná zásoba neexistuje.');
      sp = r3(num(p.spotreba)); if (!(sp > 0)) err('Zadej, kolik položka ubere ze zásoby (např. 0,5 l).');
    }
    var it = p.id ? itemById(db, p.id) : null;
    if (it) {
      it.nazev = nazev; it.cena = cena; it.aktivni = p.aktivni === false ? 0 : 1; it.zasobaId = zid; it.spotreba = sp;
      if (p.poradi != null && p.poradi !== '') it.poradi = +p.poradi;
      op(db, 'update', 'items', it);
    } else {
      var max = db.items.reduce(function (s, x) { return Math.max(s, +x.poradi || 0); }, 0);
      it = { id: newId('i'), nazev: nazev, cena: cena, zasobaId: zid, spotreba: sp, aktivni: 1, poradi: max + 10 };
      db.items.push(it); op(db, 'append', 'items', it);
    }
    return { ok: true, id: it.id };
  }

  function saveMember(db, a, p) {
    needAdmin(db, a);
    var jmeno = String(p.jmeno || '').trim(); if (!jmeno) err('Zadej jméno.');
    var pin = String(p.pin == null ? '' : p.pin).trim();
    if (pin && !/^\d{4}$/.test(pin)) err('PIN musí mít 4 číslice.');
    var m = p.id ? memberById(db, p.id) : null;
    if (m) {
      m.jmeno = jmeno; if (p.pin != null) m.pin = pin; m.aktivni = p.aktivni === false ? 0 : 1;
      if (p.novyOdkaz) m.token = newToken();
      op(db, 'update', 'members', m);
    } else {
      var vs = db.members.reduce(function (s, x) { return Math.max(s, +x.vs || 0); }, 100) + 1;
      m = { id: newId('c'), jmeno: jmeno, token: newToken(), pin: '', typ: 'clen', aktivni: 1, vs: vs };
      db.members.push(m); op(db, 'append', 'members', m);
    }
    return { ok: true, id: m.id };
  }

  function saveSettings(db, a, p) {
    needAdmin(db, a);
    var s = db.settings, ch = {};
    if (p.klub != null) ch.klub = String(p.klub).trim() || 'Klub';
    if (p.iban != null) {
      var ib = String(p.iban).replace(/\s+/g, '').toUpperCase();
      if (ib && !/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(ib)) err('IBAN nevypadá správně (např. CZ65 0800 …).');
      ch.iban = ib;
    }
    if (p.nizkySklad != null) ch.nizkySklad = Math.max(0, Math.round(+p.nizkySklad || 0));
    if (p.adminPin) { if (!/^\d{4,8}$/.test(String(p.adminPin))) err('PIN správce: 4–8 číslic.'); ch.adminPin = String(p.adminPin); }
    if (p.novyTablet) ch.tabletKey = newToken() + newToken();
    Object.keys(ch).forEach(function (k) { s[k] = ch[k]; op(db, 'setting', k, ch[k]); });
    return { ok: true };
  }

  function checkPin(db, a, p) {
    var w = who(db, a), m = memberById(db, p.clenId);
    if (!m || !act(m)) err('Člen nenalezen.');
    if (w.role === 'tablet') checkMemberPin(m, p.pin);
    return { ok: true };
  }

  var API = { state: state, checkPin: checkPin, add: add, checkin: checkin, checkout: checkout, setOpen: setOpen, setFav: setFav, requestPay: requestPay, cancelPayReq: cancelPayReq, resolvePayReq: resolvePayReq, undo: undo, pay: pay, stock: stock, saveStock: saveStock, deleteStock: deleteStock, deleteItem: deleteItem, saveItem: saveItem, saveMember: saveMember, saveSettings: saveSettings };
  function run(db, action, auth, payload) {
    if (!API[action]) err('Neznámá akce.');
    return API[action](db, auth, payload || {});
  }
  return { run: run, newToken: newToken, newId: newId, rnd: rnd, READS: { state: 1, checkPin: 1 } };
})();

</script>
<script>
(function () {
  'use strict';
  var DEMO = !API_URL;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $('#app'), sheet = $('#sheet');
  var BASE = location.origin + location.pathname;
  var ROUTE = {}, AUTH = null, ST = null, SKEW = 0, POLL = null;

  /* ---------- utils ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var nf = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 2 });
  function kc(n) { return nf.format(n) + '\u00a0Kč'; }
  function fmtNum(n) { return nf.format(Math.round((+n || 0) * 100) / 100); }

  /* offline otevření stránky (jen po nasazení na https, ne v demu) */
  if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') {

  }

  /* automatická aktualizace: stránka si každých 5 minut (a po probuzení) zkontroluje, jestli na webu není novější verze.
     Když ano, počká na vhodnou chvíli (nikdo zrovna nepíše, není otevřený panel člena) a sama se znovu načte. */
  var UPDATE_READY = false;

    if (DEMO || UPDATE_READY || !navigator.onLine) return;

    return !OPEN && !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) && !FLUSHING && !(PEND) ;

  function tryReload() {
